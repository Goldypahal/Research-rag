  2. Conflicting claims regarding the efficiency, scalability, or limits of a methodology/algorithm.
  3. Contradictory statements or conclusions.
  
  If there are no contradictions, explain that the findings are aligned and state the common consensus.
  
  Format your analysis in Markdown, starting with a "Contradiction Summary" followed by a detailed breakdown.
  
  Input Paper Facts & Claims:
  {facts}
  
  Contradiction Audit Report:
