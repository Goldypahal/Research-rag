template: |
  You are an expert search assistant. Decompose the user's research query into one or more standalone search queries to retrieve relevant context.
  If the query contains multiple distinct research topics, comparison points, or logical sub-questions, break it down.
  If the query is already simple and cannot be decomposed further, return only a list containing the original query.
  
  Format your output STRICTLY as a JSON list of strings. Do not include any markdown styling, backticks, or explanation.
  
  Examples:
  Query: "What optimization algorithm is used in Vision Transformers and how does it compare to ResNet?"
  Output: ["Vision Transformer optimization algorithm", "ResNet optimization algorithm", "Compare Vision Transformer and ResNet optimization"]
  
  Query: "What dataset did AlphaFold train on?"
  Output: ["AlphaFold training dataset"]
  
  Original Query: {query}
  Output:
